<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Geocoder Comparison — Google vs Mapbox vs HERE</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0b0c10;--surface:#12141a;--border:#1e2130;--text:#d4d8e8;--muted:#4a5068;--google:#4285F4;--mapbox:#00b4a0;--here:#e05c2a;--accent:#6c7fff;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;}
#token-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;flex-direction:row;align-items:flex-end;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.token-col{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px;}
.token-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1px;}
.token-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;}
.token-label.google{color:var(--google);}.token-label.mapbox{color:var(--mapbox);}.token-label.here{color:var(--here);}
.token-status{font-size:12px;line-height:1;transition:color 0.2s;}
.token-status.ok{color:#4caf50;}.token-status.err{color:#f44336;}.token-status.empty{color:var(--muted);}
.token-input{width:100%;background:#0e1018;border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;outline:none;transition:border-color 0.2s;}
.token-input:focus{border-color:var(--accent);}.token-input::placeholder{color:#2a2f45;}
.token-input.valid{border-color:#4caf5055;}.token-input.invalid{border-color:#f4433655;}
#load-btn{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:6px 16px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;align-self:flex-end;transition:opacity 0.2s;flex-shrink:0;}
#load-btn:hover{opacity:0.85;}#load-btn:disabled{opacity:0.4;cursor:not-allowed;}
#search-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;flex-shrink:0;position:relative;}
#search-input{flex:1;background:#0e1018;border:1px solid var(--border);border-radius:5px;padding:8px 12px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:13px;outline:none;}
#search-input:focus{border-color:var(--accent);}#search-input::placeholder{color:#2a2f45;}#search-input:disabled{opacity:0.4;}
#search-btn{background:#1a1e2c;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:500;transition:border-color 0.2s;}
#search-btn:hover{border-color:var(--accent);}#search-btn:disabled{opacity:0.4;cursor:not-allowed;}
#ac-dropdown{display:none;position:absolute;top:100%;left:14px;right:14px;z-index:100;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px #00000088;}
.ac-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.12s;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.ac-active{background:#1a1e2c;}
.ac-text{flex:1;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.06em;padding:2px 5px;border-radius:3px;flex-shrink:0;opacity:0.85;}
.ac-tag.google{background:#4285F420;color:var(--google);border:1px solid #4285F440;}
.ac-tag.mapbox{background:#00b4a020;color:var(--mapbox);border:1px solid #00b4a040;}
.ac-tag.here{background:#e05c2a20;color:var(--here);border:1px solid #e05c2a40;}
#ac-hint{font-size:10px;color:var(--muted);padding:0 0 4px 2px;}
#main{display:flex;flex:1;overflow:hidden;}
#results-panel{width:420px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.provider-col{flex:1;border-bottom:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.provider-col:last-child{border-bottom:none;}
.provider-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.provider-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.provider-dot.google{background:var(--google);}.provider-dot.mapbox{background:var(--mapbox);}.provider-dot.here{background:var(--here);}
.provider-name{font-weight:600;font-size:12px;flex:1;}
.provider-latency{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
.provider-cost{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);background:#0e1018;border:1px solid var(--border);border-radius:3px;padding:1px 5px;white-space:nowrap;}
.provider-cost.active{color:var(--accent);border-color:#6c7fff40;}
.mapboxgl-popup-content{background:#12141a!important;border:1px solid #1e2130;border-radius:6px!important;padding:10px 12px!important;box-shadow:0 4px 16px #00000088!important;min-width:160px;}
.mapboxgl-popup-tip{border-top-color:#1e2130!important;border-bottom-color:#1e2130!important;}
.popup-name{font-weight:600;font-size:12px;color:#d4d8e8;margin-bottom:4px;}
.popup-addr{font-size:11px;color:#4a5068;margin-bottom:5px;line-height:1.4;}
.popup-coords{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6c7fff;}
.results-list{overflow-y:auto;flex:1;padding:6px;display:flex;flex-direction:column;gap:4px;}
.result-main{font-weight:500;font-size:12px;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.result-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.result-coords{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);margin-top:2px;}
.empty-state{padding:16px;font-size:11px;color:var(--muted);font-style:italic;text-align:center;}
.loading-state{padding:16px;font-size:11px;color:var(--muted);text-align:center;}
#map{flex:1;position:relative;}
#map-legend{position:absolute;bottom:30px;left:12px;z-index:10;background:#0b0c10dd;backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:5px;}
.legend-row{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
#preset-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:6px 14px;display:flex;gap:6px;flex-shrink:0;overflow-x:auto;white-space:nowrap;}
#preset-bar::-webkit-scrollbar{height:3px;}
.preset-chip{background:#12141a;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:3px 10px;font-size:11px;cursor:pointer;flex-shrink:0;transition:all 0.15s;font-family:'IBM Plex Sans',sans-serif;}
.preset-chip:hover{border-color:var(--accent);color:var(--text);}
.preset-chip.active{border-color:var(--accent);color:var(--accent);background:#6c7fff15;}
#rank-bar{display:none;flex-shrink:0;border-bottom:1px solid var(--border);background:#0e1018;}
.rank-bar-cell{flex:1;padding:5px 10px;border-right:1px solid var(--border);min-width:0;}
.rank-bar-cell:last-child{border-right:none;}
.rank-bar-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.06em;display:block;margin-bottom:1px;}
.rank-bar-label.google{color:var(--google);}.rank-bar-label.mapbox{color:var(--mapbox);}.rank-bar-label.here{color:var(--here);}
.rank-bar-text{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.result-item{padding:6px 10px;border-radius:5px;border:1px solid transparent;cursor:pointer;transition:all 0.15s;display:flex;align-items:flex-start;gap:7px;}
.result-item:hover{background:#14172080;border-color:var(--border);}.result-item.selected{border-color:var(--accent)!important;background:#1a1e2c;}
.rank-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);background:#0e1018;border:1px solid var(--border);border-radius:3px;padding:1px 4px;flex-shrink:0;margin-top:1px;}
.result-body{flex:1;min-width:0;}
</style>
</head>
<body>
<div id="token-bar">
  <div class="token-col">
    <div class="token-head">
      <span class="token-label google">GOOGLE</span>
      <span class="token-status empty" id="st-google">—</span>
    </div>
    <input class="token-input" id="tk-google" type="password" placeholder="AIza… (Places enabled)" autocomplete="off"/>
  </div>
  <div class="token-col">
    <div class="token-head">
      <span class="token-label mapbox">MAPBOX</span>
      <span class="token-status empty" id="st-mapbox">—</span>
    </div>
    <input class="token-input" id="tk-mapbox" type="password" placeholder="pk.eyJ1…" value="__MAPBOX_TOKEN__" autocomplete="off"/>
  </div>
  <div class="token-col">
    <div class="token-head">
      <span class="token-label here">HERE</span>
      <span class="token-status empty" id="st-here">—</span>
    </div>
    <input class="token-input" id="tk-here" type="password" placeholder="HERE API key" autocomplete="off"/>
  </div>
  <button id="load-btn" disabled>Load APIs</button>
</div>
<div id="search-bar">
  <input id="search-input" type="text" placeholder="Type 3+ characters to compare all three…" disabled/>
  <button id="search-btn" disabled>Compare</button>
  <div id="ac-dropdown"></div>
</div>
<div id="preset-bar"></div>
<div id="main">
  <div id="results-panel">
    <div id="rank-bar">
      <div class="rank-bar-cell"><span class="rank-bar-label google">GOOGLE #1</span><span class="rank-bar-text" id="rb-google">—</span></div>
      <div class="rank-bar-cell"><span class="rank-bar-label mapbox">MAPBOX #1</span><span class="rank-bar-text" id="rb-mapbox">—</span></div>
      <div class="rank-bar-cell"><span class="rank-bar-label here">HERE #1</span><span class="rank-bar-text" id="rb-here">—</span></div>
    </div>
    <div class="provider-col">
      <div class="provider-header">
        <span class="provider-dot google"></span>
        <span class="provider-name">Google Places</span>
        <span class="provider-latency" id="lat-google">—</span>
        <span class="provider-cost" id="cost-google" title="Place Details: $0.017/req × 5 results">$0.085/search</span>
      </div>
      <div class="results-list" id="list-google"><div class="empty-state">Awaiting search…</div></div>
    </div>
    <div class="provider-col">
      <div class="provider-header">
        <span class="provider-dot mapbox"></span>
        <span class="provider-name">Mapbox Geocoding</span>
        <span class="provider-latency" id="lat-mapbox">—</span>
        <span class="provider-cost" id="cost-mapbox" title="Geocoding API: $0.00075/req">$0.00075/search</span>
      </div>
      <div class="results-list" id="list-mapbox"><div class="empty-state">Awaiting search…</div></div>
    </div>
    <div class="provider-col">
      <div class="provider-header">
        <span class="provider-dot here"></span>
        <span class="provider-name">HERE Geocoding</span>
        <span class="provider-latency" id="lat-here">—</span>
        <span class="provider-cost" id="cost-here" title="Geocoding &amp; Search API: $0.00149/req">$0.00149/search</span>
      </div>
      <div class="results-list" id="list-here"><div class="empty-state">Awaiting search…</div></div>
    </div>
  </div>
  <div id="map">
    <div id="map-legend">
      <div class="legend-row"><span class="legend-dot" style="background:var(--google)"></span>Google</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--mapbox)"></span>Mapbox</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--here)"></span>HERE</div>
    </div>
  </div>
</div>
<script>
let map, googleReady=false;
const markers={google:[],mapbox:[],here:[]};
const colors={google:'#4285F4',mapbox:'#00b4a0',here:'#e05c2a'};
const tokens={google:'',mapbox:'',here:''};
// Cost per search (Google = 5×Place Details; others = 1×geocode)
const COST_PER_SEARCH={google:0.085,mapbox:0.00075,here:0.00149};
const callCount={google:0,mapbox:0,here:0};

function updateCostDisplay(p){
  const el=document.getElementById('cost-'+p);
  const n=callCount[p];
  if(n===0){el.className='provider-cost';return;}
  const total=(n*COST_PER_SEARCH[p]).toFixed(4);
  el.textContent=n+' search'+(n>1?'es':'')+' · ~$'+total;
  el.className='provider-cost active';
}

function setList(p,html){document.getElementById('list-'+p).innerHTML=html;}
function setLatency(p,ms){document.getElementById('lat-'+p).textContent=ms!=null?ms+'ms':'—';}
function clearMarkers(p){markers[p].forEach(m=>m.remove());markers[p]=[];}

function addMarker(provider,lng,lat,label,address){
  if(!map)return;
  const el=document.createElement('div');
  el.style.cssText=`width:12px;height:12px;border-radius:50%;background:${colors[provider]};border:2px solid #fff;box-shadow:0 0 6px ${colors[provider]}88;cursor:pointer;`;

  const popupEl=document.createElement('div');
  const nameEl=document.createElement('div');
  nameEl.className='popup-name';
  nameEl.textContent=label;
  popupEl.appendChild(nameEl);
  if(address&&address!==label){
    const addrEl=document.createElement('div');
    addrEl.className='popup-addr';
    addrEl.textContent=address;
    popupEl.appendChild(addrEl);
  }
  const coordEl=document.createElement('div');
  coordEl.className='popup-coords';
  coordEl.textContent=lat.toFixed(5)+', '+lng.toFixed(5);
  popupEl.appendChild(coordEl);

  const popup=new mapboxgl.Popup({offset:14,maxWidth:'240px'}).setDOMContent(popupEl);
  const m=new mapboxgl.Marker({element:el}).setLngLat([lng,lat]).setPopup(popup).addTo(map);
  markers[provider].push(m);
}

function resultCard(main,sub,coords,provider,idx,onClick){
  const div=document.createElement('div');
  div.className='result-item';

  const badge=document.createElement('span');
  badge.className='rank-badge';
  badge.textContent='#'+(idx+1);

  const body=document.createElement('div');
  body.className='result-body';

  const mainEl=document.createElement('div');
  mainEl.className='result-main';
  mainEl.title=main;
  mainEl.textContent=main;

  const subEl=document.createElement('div');
  subEl.className='result-sub';
  subEl.title=sub;
  subEl.textContent=sub;

  body.appendChild(mainEl);
  body.appendChild(subEl);

  if(coords){
    const coordEl=document.createElement('div');
    coordEl.className='result-coords';
    coordEl.textContent=coords;
    body.appendChild(coordEl);
  }

  div.appendChild(badge);
  div.appendChild(body);

  div.addEventListener('click',()=>{
    document.querySelectorAll(`#list-${provider} .result-item`).forEach(el=>el.classList.remove('selected'));
    div.classList.add('selected');
    onClick();
  });
  return div;
}

// ── Query presets ───────────────────────────────────────────────
const PRESETS=[
  {label:'Sandton Drive #1',     query:'1 Sandton Drive, Sandton, Johannesburg'},
  {label:'Chris Hani, Khayelitsha', query:'Chris Hani Drive, Khayelitsha, Cape Town'},
  {label:'V&A Waterfront',       query:'V&A Waterfront, Cape Town'},
  {label:'Vilakazi Street',      query:'Vilakazi Street, Orlando West, Soweto'},
  {label:'OR Tambo Airport',     query:'OR Tambo International Airport'},
  {label:'Kirstenbosch',         query:'Kirstenbosch National Botanical Garden'},
  {label:'William Nicol & Sandton Dr', query:'cnr William Nicol Drive and Sandton Drive'},
  {label:'Hartbeespoort Dam',    query:'Hartbeespoort Dam, North West'},
  {label:'Long Street Cape Town',query:'Long Street, Cape Town City Centre'},
  {label:'Luthuli Street Durban',query:'Chief Albert Luthuli Street, Durban CBD'},
];

let activePreset=null;
(function buildPresets(){
  const bar=document.getElementById('preset-bar');
  PRESETS.forEach(({label,query})=>{
    const btn=document.createElement('button');
    btn.className='preset-chip';
    btn.textContent=label;
    btn.title=query;
    btn.addEventListener('click',()=>{
      const inp=document.getElementById('search-input');
      if(!inp.disabled){
        if(activePreset) activePreset.classList.remove('active');
        btn.classList.add('active');
        activePreset=btn;
        inp.value=query;
        hideDropdown();
        runSearch();
      }
    });
    bar.appendChild(btn);
  });
})();

function updateRankBar(){
  ['google','mapbox','here'].forEach(p=>{
    const first=document.querySelector('#list-'+p+' .result-item:first-child .result-body .result-main');
    document.getElementById('rb-'+p).textContent=first?first.textContent:'No results';
  });
  document.getElementById('rank-bar').style.display='flex';
}
// ───────────────────────────────────────────────────────────────

// ── Token validation ────────────────────────────────────────────
const validators = {
  google: v => v.startsWith('AIza') && v.length > 30,
  mapbox: v => v.startsWith('pk.') && v.length > 20,
  here:   v => v.length > 8,
};

function updateTokenStatus(provider) {
  const input = document.getElementById('tk-' + provider);
  const status = document.getElementById('st-' + provider);
  const v = input.value.trim();
  if (!v) {
    input.className = 'token-input';
    status.className = 'token-status empty';
    status.textContent = '—';
  } else if (validators[provider](v)) {
    input.className = 'token-input valid';
    status.className = 'token-status ok';
    status.textContent = '✓';
  } else {
    input.className = 'token-input invalid';
    status.className = 'token-status err';
    status.textContent = '✗';
  }
  // Enable Load APIs only when Mapbox is valid
  const mbValid = validators.mapbox(document.getElementById('tk-mapbox').value.trim());
  document.getElementById('load-btn').disabled = !mbValid;
}

['google','mapbox','here'].forEach(p => {
  const input = document.getElementById('tk-' + p);
  input.addEventListener('input', () => updateTokenStatus(p));
  // Run once on load to reflect pre-filled values
  updateTokenStatus(p);
});

function initMap() {
  tokens.google = document.getElementById('tk-google').value.trim();
  tokens.mapbox = document.getElementById('tk-mapbox').value.trim();
  tokens.here   = document.getElementById('tk-here').value.trim();
  mapboxgl.accessToken = tokens.mapbox;
  map = new mapboxgl.Map({container:'map', style:'mapbox://styles/mapbox/dark-v11', center:[28.0473,-26.2041], zoom:9});
  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');
  if (tokens.google) {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${tokens.google}&libraries=places&callback=onGoogleReady`;
    s.async = true;
    s.onerror = () => setList('google', '<div class="empty-state">Google key invalid or quota exceeded</div>');
    document.head.appendChild(s);
  } else {
    setList('google', '<div class="empty-state">No Google key — skipped</div>');
  }
  document.getElementById('search-input').disabled = false;
  document.getElementById('search-btn').disabled = false;
  document.getElementById('search-input').focus();
}

document.getElementById('load-btn').addEventListener('click', initMap);

// Auto-init if Mapbox token was pre-filled at deploy time
if (validators.mapbox(document.getElementById('tk-mapbox').value.trim())) {
  initMap();
}

window.onGoogleReady = () => { googleReady = true; };

document.getElementById('search-btn').addEventListener('click',runSearch);
document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});

async function runSearch(){
  const q=document.getElementById('search-input').value.trim();
  if(!q)return;
  ['google','mapbox','here'].forEach(p=>{setList(p,'<div class="loading-state">Searching…</div>');setLatency(p,null);clearMarkers(p);});
  await Promise.all([searchGoogle(q),searchMapbox(q),searchHere(q)]);
  ['google','mapbox','here'].forEach(p=>{callCount[p]++;updateCostDisplay(p);});
  updateRankBar();
}

function searchGoogle(q){
  return new Promise(resolve=>{
    if(!googleReady||!tokens.google){setList('google','<div class="empty-state">No Google key — skipped</div>');return resolve();}
    const t0=performance.now();
    const svc=new google.maps.places.AutocompleteService();
    svc.getPlacePredictions({input:q,componentRestrictions:{country:'za'}},(predictions,status)=>{
      const ms=Math.round(performance.now()-t0);setLatency('google',ms);
      if(status!==google.maps.places.PlacesServiceStatus.OK||!predictions?.length){setList('google','<div class="empty-state">No results</div>');return resolve();}
      const list=document.getElementById('list-google');list.innerHTML='';
      const detailSvc=new google.maps.places.PlacesService(document.createElement('div'));
      let done=0;const items=predictions.slice(0,5);
      items.forEach((p,i)=>{
        detailSvc.getDetails({placeId:p.place_id,fields:['name','formatted_address','geometry']},(place,dStatus)=>{
          done++;
          const main=p.structured_formatting?.main_text||p.description;
          const sub=p.structured_formatting?.secondary_text||'';
          let coords=null,lng,lat;
          if(dStatus===google.maps.places.PlacesServiceStatus.OK&&place?.geometry){
            lat=place.geometry.location.lat();lng=place.geometry.location.lng();
            coords=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            addMarker('google',lng,lat,main,sub);
          }
          list.appendChild(resultCard(main,sub,coords,'google',i,()=>{if(lng!=null)map.flyTo({center:[lng,lat],zoom:14,duration:800});}));
          if(done===items.length)resolve();
        });
      });
    });
  });
}

async function searchMapbox(q){
  try{
    const t0=performance.now();
    const res=await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${tokens.mapbox}&country=za&language=en&limit=5`);
    const data=await res.json();
    const ms=Math.round(performance.now()-t0);setLatency('mapbox',ms);
    const features=data.features||[];
    if(!features.length){setList('mapbox','<div class="empty-state">No results</div>');return;}
    const list=document.getElementById('list-mapbox');list.innerHTML='';
    features.forEach((f,i)=>{
      const[lng,lat]=f.center;const main=f.text||f.place_name;const sub=f.place_name;
      addMarker('mapbox',lng,lat,main,sub);
      list.appendChild(resultCard(main,sub,`${lat.toFixed(5)}, ${lng.toFixed(5)}`,'mapbox',i,()=>map.flyTo({center:[lng,lat],zoom:14,duration:800})));
    });
  }catch(e){setList('mapbox',`<div class="empty-state">Error: ${e.message}</div>`);}
}

// ── Autocomplete ────────────────────────────────────────────────
const MIN_AC_CHARS = 3;
const AC_DEBOUNCE_MS = 300;
let acTimer = null;
let acActive = -1;

const acDropdown = document.getElementById('ac-dropdown');

function showDropdown(items) {
  acActive = -1;
  if (!items.length) { hideDropdown(); return; }
  while (acDropdown.firstChild) acDropdown.removeChild(acDropdown.firstChild);
  items.forEach(({text, provider, onSelect}) => {
    const div = document.createElement('div');
    div.className = 'ac-item';

    const textSpan = document.createElement('span');
    textSpan.className = 'ac-text';
    textSpan.textContent = text;

    const tagSpan = document.createElement('span');
    tagSpan.className = 'ac-tag ' + provider;
    tagSpan.textContent = provider;

    div.appendChild(textSpan);
    div.appendChild(tagSpan);

    div.addEventListener('mousedown', e => {
      e.preventDefault(); // keep focus on input
      document.getElementById('search-input').value = text;
      hideDropdown();
      onSelect();
    });
    acDropdown.appendChild(div);
  });
  acDropdown.style.display = 'block';
}

function hideDropdown() {
  acDropdown.style.display = 'none';
  while (acDropdown.firstChild) acDropdown.removeChild(acDropdown.firstChild);
  acActive = -1;
}

// Keyboard navigation
document.getElementById('search-input').addEventListener('keydown', e => {
  const items = acDropdown.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acActive = Math.min(acActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('ac-active', i === acActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acActive = Math.max(acActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('ac-active', i === acActive));
  } else if (e.key === 'Enter') {
    if (acActive >= 0 && items[acActive]) {
      items[acActive].dispatchEvent(new MouseEvent('mousedown'));
    } else {
      runSearch();
    }
    hideDropdown();
  } else if (e.key === 'Escape') {
    hideDropdown();
  }
});

document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(acTimer);
  if (activePreset) { activePreset.classList.remove('active'); activePreset=null; }
  if (q.length < MIN_AC_CHARS) { hideDropdown(); return; }
  acTimer = setTimeout(() => fetchAcAll(q), AC_DEBOUNCE_MS);
});

document.addEventListener('click', e => {
  if (!e.target.closest('#search-bar')) hideDropdown();
});

async function fetchAcAll(q) {
  const [gItems, mbItems, hereItems] = await Promise.all([
    fetchAcGoogle(q),
    fetchAcMapbox(q),
    fetchAcHere(q),
  ]);
  // Merge and deduplicate by first 40 chars of lowercased label, cap at 10
  const seen = new Set();
  const merged = [];
  for (const item of [...gItems, ...mbItems, ...hereItems]) {
    const key = item.text.toLowerCase().slice(0, 40);
    if (!seen.has(key)) { seen.add(key); merged.push(item); }
    if (merged.length >= 10) break;
  }
  showDropdown(merged);
}

function fetchAcGoogle(q) {
  return new Promise(resolve => {
    if (!googleReady || !tokens.google) return resolve([]);
    const svc = new google.maps.places.AutocompleteService();
    svc.getPlacePredictions({input: q, componentRestrictions: {country: 'za'}}, (predictions, status) => {
      if (status !== google.maps.places.PlacesServiceStatus.OK || !predictions?.length) return resolve([]);
      resolve(predictions.slice(0, 5).map(p => ({
        text: p.description,
        provider: 'google',
        onSelect: () => runSearch(),
      })));
    });
  });
}

async function fetchAcMapbox(q) {
  if (!tokens.mapbox) return [];
  try {
    const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${tokens.mapbox}&country=za&language=en&limit=5&autocomplete=true`);
    const data = await res.json();
    return (data.features || []).slice(0, 5).map(f => ({
      text: f.place_name,
      provider: 'mapbox',
      onSelect: () => runSearch(),
    }));
  } catch { return []; }
}

async function fetchAcHere(q) {
  if (!tokens.here) return [];
  try {
    const res = await fetch(`https://autocomplete.search.hereapi.com/v1/autocomplete?q=${encodeURIComponent(q)}&in=countryCode:ZAF&limit=5&apiKey=${tokens.here}`);
    const data = await res.json();
    return (data.items || []).slice(0, 5).map(item => ({
      text: item.title,
      provider: 'here',
      onSelect: () => runSearch(),
    }));
  } catch { return []; }
}
// ────────────────────────────────────────────────────────────────

async function searchHere(q){
  if(!tokens.here){setList('here','<div class="empty-state">No HERE key — skipped</div>');return;}
  try{
    const t0=performance.now();
    const res=await fetch(`https://geocode.search.hereapi.com/v1/geocode?q=${encodeURIComponent(q)}&in=countryCode:ZAF&limit=5&apiKey=${tokens.here}`);
    const data=await res.json();
    const ms=Math.round(performance.now()-t0);setLatency('here',ms);
    const items=data.items||[];
    if(!items.length){setList('here','<div class="empty-state">No results</div>');return;}
    const list=document.getElementById('list-here');list.innerHTML='';
    items.forEach((item,i)=>{
      const{lat,lng}=item.position;const main=item.title;const sub=item.address?.label||'';
      addMarker('here',lng,lat,main,sub);
      list.appendChild(resultCard(main,sub,`${lat.toFixed(5)}, ${lng.toFixed(5)}`,'here',i,()=>map.flyTo({center:[lng,lat],zoom:14,duration:800})));
    });
  }catch(e){setList('here',`<div class="empty-state">Error: ${e.message}</div>`);}
}
